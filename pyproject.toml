[project]
name = "statin-agent"
version = "0.1.0"
description = "Tool-using LLM agent that finds statin care gaps in longitudinal records, with self-checking and uncertainty-based deferral"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
